name: Build Geode Mod (Multi-Platform)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: Mac

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          combine: false  # Set false dulu per platform

  combine:
    name: Combine Builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Combine multi-platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload combined .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-Progress-Bot.geode
          path: ${{ steps.combine.outputs.output-path }}